<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sizzle &amp; Serve — a tiny kitchen cooking game</title>
<style>
  html, body { margin: 0; padding: 0; background: #241811; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  #wrap { width: min(1280px, 100vw); }
  canvas { display: block; width: 100%; height: auto; background: #3a2e26; }
  #hint { color: #c9a37e; font: 13px "Trebuchet MS", sans-serif; text-align: center; padding: 8px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hint">Move: WASD / arrows or click &nbsp;•&nbsp; Use a station: E &nbsp;•&nbsp; Mute: M &nbsp;•&nbsp; Pause: P</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
